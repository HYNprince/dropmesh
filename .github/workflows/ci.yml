name: DropMesh CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Run npm install on your Mac first and COMMIT package-lock.json.
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
        env:
          # Non-routable placeholder used only to validate frontend compilation.
          VITE_SIGNAL_URL: wss://example.invalid/signal
      - run: npm audit --audit-level=high
